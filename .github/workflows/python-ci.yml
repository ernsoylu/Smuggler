name: Python CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml),
# which owns path filtering, concurrency, and the single required "CI Gate".
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
          # --locked pins the exact resolved versions from uv.lock, and
          # --no-build means no third-party source distribution is ever built,
          # so no dependency's setup.py executes in CI. --no-install-project is
          # what makes --no-build possible: the project itself is an editable
          # install and would otherwise have to be "built". api/ and cli/ import
          # fine from the repo root, so nothing needs it installed.
        run: uv sync --locked --no-build --all-extras --no-install-project

      - name: Ruff
        run: uv run --no-sync --no-build ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor (requires-python) and carries the coverage run;
        # 3.14 is here because docker/Dockerfile.api is expected to move to a
        # 3.14 base — production should not run an interpreter no job exercises.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
          # --locked pins the exact resolved versions from uv.lock, and
          # --no-build means no third-party source distribution is ever built,
          # so no dependency's setup.py executes in CI. --no-install-project is
          # what makes --no-build possible: the project itself is an editable
          # install and would otherwise have to be "built". api/ and cli/ import
          # fine from the repo root, so nothing needs it installed.
        run: uv sync --locked --no-build --all-extras --no-install-project

      # One run per interpreter — coverage-instrumented on 3.12 (fed to Sonar),
      # plain on 3.13 so we still exercise the newer runtime.
      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            uv run --no-sync --no-build pytest tests/ -q --tb=short \
              --cov=cli --cov=api --cov-report=term-missing --cov-report=xml
          else
            uv run --no-sync --no-build pytest tests/ -q --tb=short
          fi
        env:
          SMG_LOGGING: "false"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: coverage.xml
