name: Python CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml),
# which owns path filtering, concurrency, and the single required "CI Gate".
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # One run per interpreter — coverage-instrumented on 3.12 (fed to Sonar),
      # plain on 3.13 so we still exercise the newer runtime.
      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            uv run pytest tests/ -q --tb=short \
              --cov=cli --cov=api --cov-report=term-missing --cov-report=xml
          else
            uv run pytest tests/ -q --tb=short
          fi
        env:
          SMG_LOGGING: "false"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: python-coverage
          path: coverage.xml
