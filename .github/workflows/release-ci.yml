name: Release CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml)
# from the `publish` job, which only runs on a push to main once CI Gate is
# green. Publishing is deliberately downstream of the gate: `latest` should
# never point at a commit that failed lint, tests or a CVE scan.
#
# Images are multi-arch (amd64 + arm64) because a Raspberry Pi is a plausible
# Smuggler host. Every push to main publishes two tags:
#   :latest         moving pointer at the tip of main
#   :sha-<12>       immutable, and what install.sh pins to by default
on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR, and the only write scope anywhere in this
      # repo's CI — every other workflow is contents: read. Scoped to this job
      # rather than the workflow so the checkout and buildx steps of any future
      # job here do not inherit it. Note that checkout still runs with
      # persist-credentials: false, so no pushable git credential is retained.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/Dockerfile.api
          - name: web
            context: .
            file: docker/Dockerfile.web
          - name: mule-wireguard
            context: worker_image
            file: worker_image/Dockerfile
          - name: mule-openvpn
            context: worker_image_ovpn
            file: worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: ref
        run: |
          # GHCR rejects uppercase path segments; the owner is used verbatim in
          # the image name, so normalise it rather than trusting its casing.
          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          {
            echo "image=ghcr.io/${owner}/smuggler-${MATRIX_NAME}"
            echo "sha=sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
          MATRIX_NAME: ${{ matrix.name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:latest
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.sha }}
          # Kept on a separate cache scope from docker-ci.yml's amd64-only
          # build, so multi-arch layers never displace the PR build's cache.
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
