name: SonarQube Cloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: Analyze & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sonar can attribute issues/coverage to New Code.
          fetch-depth: 0

      # ── Python coverage (coverage.xml) ────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Run Python tests with coverage
        run: uv run pytest tests/ -q --tb=short --cov=cli --cov=api --cov-report=xml
        env:
          DVD_LOGGING: "false"

      # ── Frontend coverage (web/coverage/lcov.info) ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: web
        run: npm run test:coverage

      # ── SonarQube Cloud scan + quality gate ───────────────────────────────
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
