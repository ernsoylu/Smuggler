name: Frontend CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test:run

      - name: Build
        working-directory: web
        run: npm run build
