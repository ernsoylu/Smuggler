name: Security CI

# Supply-chain scanning: dependency CVEs, image CVEs, IaC misconfiguration and
# an SBOM. Reusable (invoked by .github/workflows/ci.yml) *and* scheduled,
# because a dependency advisory can land without anyone touching the code —
# only running this on push would leave known CVEs unreported indefinitely.
on:
  workflow_call:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"
          enable-cache: true

      # Audit the resolved lock file rather than pyproject ranges, so the report
      # matches what actually gets installed.
      - name: Export locked dependencies
        run: uv export --no-hashes --no-emit-project --format requirements-txt > requirements-lock.txt

      - name: pip-audit
        # Pinned: an unpinned uvx resolves and executes whatever is newest.
        run: uvx pip-audit@2.10.1 --strict --requirement requirements-lock.txt

  frontend-deps:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts: no dependency lifecycle script runs during install.
      - run: npm ci --ignore-scripts

      # Production dependencies ship to the browser, so any advisory there is a
      # hard failure.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Build/lint tooling never reaches a user. Still reported, so advisories
      # are visible, but a DoS in a lint transitive dep should not block a merge.
      - name: Audit all dependencies (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  image-cves:
    name: Image CVEs (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/Dockerfile.api
          - name: web
            context: .
            file: docker/Dockerfile.web
          - name: mule-wireguard
            context: worker_image
            file: worker_image/Dockerfile
          - name: mule-openvpn
            context: worker_image_ovpn
            file: worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: smuggler-scan-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Trivy runs as a container rather than via aquasecurity/trivy-action.
      # The action is SHA-pinned but internally references a *floating* tag of
      # aquasecurity/setup-trivy, which upstream deleted — the pin protected
      # against content drift but not against a vanished transitive dependency,
      # and every scan job failed at "Set up job". A digest-pinned image has no
      # such indirection, and is exactly how these scans were validated locally.
      #
      # --ignore-unfixed is deliberate: the Debian and Alpine bases carry dozens
      # of HIGH/CRITICAL advisories with no upstream patch available, so gating
      # on those would leave CI permanently red for something no change here can
      # resolve. Failing only on fixable CVEs keeps the signal actionable — the
      # fix is always "rebuild against a newer base digest".
      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --scanners vuln --ignore-unfixed \
                  --severity HIGH,CRITICAL --exit-code 1 --format table \
                  "smuggler-scan-${{ matrix.name }}:ci"

  iac-config:
    name: IaC misconfiguration (trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Reads .trivyignore, which documents the one accepted finding (DS-0002)
      # and why. Anything new fails. Container rather than action — see the
      # image-scan job above for why.
      - name: Trivy config scan
        run: |
          docker run --rm \
            -v "${PWD}:/src" -w /src \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            config --severity HIGH,CRITICAL --exit-code 1 \
                   --ignorefile /src/.trivyignore --format table /src

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Records what a build actually contains, so a future advisory can be
      # matched against a specific commit without rebuilding it.
      - name: Generate SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          path: .
          format: cyclonedx-json
          artifact-name: smuggler-sbom.cyclonedx.json
          output-file: smuggler-sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sbom
          path: smuggler-sbom.cyclonedx.json
          retention-days: 90
