name: Docker CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile.api
          - docker/Dockerfile.web
          - worker_image/Dockerfile
          - worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Fail only on genuine errors; unpinned-apt style warnings stay advisory.
          failure-threshold: error

  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/Dockerfile.api
          - name: web
            context: .
            file: docker/Dockerfile.web
          - name: mule-wireguard
            context: worker_image
            file: worker_image/Dockerfile
          - name: mule-openvpn
            context: worker_image_ovpn
            file: worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render & validate compose config
        run: docker compose config --quiet
        env:
          # Compose substitutes these; provide harmless defaults so `config`
          # doesn't warn about unset variables during validation. SMG_API_BIND
          # is no longer among them — compose sets it explicitly now.
          SMG_SECRET_KEY: ""
          SMG_SECRET_SALT: ""
          SMG_API_TOKEN: ""
