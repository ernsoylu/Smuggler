name: Docker CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfile (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/Dockerfile.api
          - docker/Dockerfile.web
          - worker_image/Dockerfile
          - worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Fail only on genuine errors; unpinned-apt style warnings stay advisory.
          failure-threshold: error

  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: docker/Dockerfile.api
          - name: web
            context: .
            file: docker/Dockerfile.web
          - name: mule-wireguard
            context: worker_image
            file: worker_image/Dockerfile
          - name: mule-openvpn
            context: worker_image_ovpn
            file: worker_image_ovpn/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render & validate compose config
        run: docker compose config --quiet
        env:
          # Compose substitutes these; provide harmless defaults so `config`
          # doesn't warn about unset variables during validation.
          SMG_SECRET_KEY: ""
          SMG_API_TOKEN: ""
          SMG_API_BIND: "127.0.0.1:55555"
