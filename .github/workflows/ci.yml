name: CI

# Single entry point for all CI. Detects which areas changed, runs only the
# relevant reusable workflows, and ends in one always-running "CI Gate" job.
# Require just "CI Gate" in branch protection: it reports on every PR and
# fails if any triggered area failed (skipped areas count as passing).
#
# The required-check string is "CI Gate", not "CI / CI Gate" — "CI" is this
# workflow's name, which GitHub renders as a prefix in the Checks tab but is
# not part of the status context. A rule naming "CI / CI Gate" matches nothing
# and silently never enforces.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Permissions are declared per job (least privilege, explicit per job).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      shell: ${{ steps.filter.outputs.shell }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'api/**'
              - 'cli/**'
              - 'tests/**'
              - 'main.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/python-ci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - 'worker_image/**'
              - 'worker_image_ovpn/**'
              - 'docker-compose.yml'
              - 'requirements.txt'
              - '.github/workflows/docker-ci.yml'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
              - '.github/workflows/shell-ci.yml'
              - '.github/workflows/ci.yml'
            security:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements.txt'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'docker/**'
              - 'worker_image/**'
              - 'worker_image_ovpn/**'
              - 'docker-compose.yml'
              - '.trivyignore'
              - '.github/workflows/security-ci.yml'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-ci.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-ci.yml

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-ci.yml

  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/shell-ci.yml

  security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/security-ci.yml

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    permissions: {}
    needs: [changes, python, frontend, docker, shell, security]
    steps:
      - name: Verify no triggered job failed
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "python=${{ needs.python.result }}   frontend=${{ needs.frontend.result }}"
          echo "docker=${{ needs.docker.result }} shell=${{ needs.shell.result }}"
          echo "security=${{ needs.security.result }}"
          for r in "${{ needs.changes.result }}" \
                   "${{ needs.python.result }}" \
                   "${{ needs.frontend.result }}" \
                   "${{ needs.docker.result }}" \
                   "${{ needs.shell.result }}" \
                   "${{ needs.security.result }}"; do
            # Allowed outcomes: success (ran & passed) or skipped (area unchanged).
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required CI job did not pass (result: $r)."
              exit 1
            fi
          done
          echo "CI Gate: all triggered jobs passed."

  # Publish images to GHCR. Deliberately NOT path-filtered: the api image
  # embeds api/ + cli/ + requirements.txt and the web image embeds web/, so a
  # commit that changes no Dockerfile still changes what `latest` should point
  # at. Gated on ci-gate, so a red build never becomes `latest`.
  publish:
    name: Publish images
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-ci.yml
