name: Desktop CI

# Reusable workflow — invoked by the CI orchestrator (.github/workflows/ci.yml).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: desktop
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: desktop
        run: ./gradlew build

      - name: Generate Shadow JAR
        working-directory: desktop
        run: ./gradlew shadowJar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smuggler-desktop-shadow
          path: desktop/build/libs/smuggler-desktop-*-all.jar
