version: 2

# Security scanning tells you a CVE exists; this is what actually closes it.
# Grouped so a week of patch bumps arrives as one reviewable PR per ecosystem
# rather than a dozen, and security updates are never grouped away with them.
# The 7-day cooldown skips just-published versions — the window in which a
# hijacked package is most likely to be caught and yanked. Security updates
# bypass cooldown, so CVE fixes still arrive immediately.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(web)"

  # Keeps the SHA pins in .github/workflows current — pinning without updates
  # just freezes known-good-at-the-time actions in place indefinitely.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Base images are digest-pinned (see the Dockerfiles), so without this they
  # would never pick up a rebuilt base carrying CVE fixes.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker
    directory: /worker_image
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker
    directory: /worker_image_ovpn
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(docker)"
