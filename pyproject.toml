[project]
name = "smuggler"
version = "0.1.0"
description = "Smuggler — isolated torrent downloads behind per-mule WireGuard VPN tunnels"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "docker>=7.2.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
smg = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
    "pytest-flask>=1.3.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.1"
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults.
#
# This *is* ruff's historical default set — pyflakes F plus pycodestyle
# E4/E7/E9: unused imports, undefined names, and real syntax/style errors. It
# is spelled out because "the default" is not a stable contract: ruff 0.16
# widened its defaults substantially, which turned a clean tree into 51
# findings on a routine patch bump and would have silently changed the gate
# without anyone choosing to.
#
# Kept deliberately conservative so a failure means something. Widen this list
# when you want more coverage — as a decision, not as a side effect of an
# upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["cli", "api"]
