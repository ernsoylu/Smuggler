services:
  smuggler-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: smuggler-api
    # Host networking so the API can reach mule RPC ports on 127.0.0.1 exactly as
    # it did bare-metal. Gunicorn binds SMG_API_BIND (loopback by default), so the
    # control plane — which holds the Docker socket — is not exposed to the LAN.
    network_mode: host
    environment:
      - SMG_HOST_ROOT=${PWD}
      - SMG_DB_PATH=${PWD}/data/smuggler.db
      # Key for encrypting stored secrets at rest (VPN config bodies + OpenVPN
      # passwords — see api/crypto.py). Sourced from .env; empty disables it.
      - SMG_SECRET_KEY=${SMG_SECRET_KEY:-}
      # Optional API token. When set, every /api/* call must carry a matching
      # X-Smuggler-Token header (the UI injects it via nginx). Empty = no token
      # auth, relying on the loopback bind below.
      - SMG_API_TOKEN=${SMG_API_TOKEN:-}
      # Gunicorn bind address. Loopback-only by default.
      - SMG_API_BIND=${SMG_API_BIND:-127.0.0.1:55555}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    restart: unless-stopped

  smuggler-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: smuggler-ui
    # Host networking so nginx can reach the loopback-bound API at 127.0.0.1:55555.
    # nginx itself listens on 127.0.0.1:8887 (see docker/nginx.conf.template).
    network_mode: host
    environment:
      # Injected into the proxied X-Smuggler-Token header so the same-origin UI
      # authenticates to a token-gated API. Only SMG_* vars are substituted.
      - SMG_API_TOKEN=${SMG_API_TOKEN:-}
      - NGINX_ENVSUBST_FILTER=^SMG_
    restart: unless-stopped
