services:
  smuggler-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: smuggler-api
    networks:
      # Reaches the UI (and is reached by it) over a normal bridge...
      - smuggler-net
      # ...and reaches every mule's aria2 RPC over an internal network with no
      # route off the host. This replaces network_mode: host, which put the
      # Docker-socket-holding control plane in the host's network namespace.
      - smuggler-rpc
    ports:
      # Published to loopback only. Gunicorn binds 0.0.0.0 *inside* the
      # container (a published port cannot reach a loopback-bound listener);
      # this mapping is what keeps the API off the LAN.
      - "127.0.0.1:55555:55555"
    environment:
      - SMG_HOST_ROOT=${PWD}
      - SMG_DB_PATH=${PWD}/data/smuggler.db
      # Key for encrypting stored secrets at rest (VPN config bodies + OpenVPN
      # passwords — see api/crypto.py). Sourced from .env; empty disables it.
      - SMG_SECRET_KEY=${SMG_SECRET_KEY:-}
      # Per-deployment scrypt salt. Empty falls back to the built-in default
      # salt, which is what existing deployments keep using.
      - SMG_SECRET_SALT=${SMG_SECRET_SALT:-}
      # API token. setup.sh generates one and leaves it enabled; every /api/*
      # call must then carry a matching X-Smuggler-Token header.
      - SMG_API_TOKEN=${SMG_API_TOKEN:-}
      # Bind all interfaces inside the container — the ports mapping above is
      # what restricts exposure to host loopback.
      - SMG_API_BIND=0.0.0.0:55555
      # Address mules by container name over smuggler-rpc rather than by their
      # published loopback port, which is only reachable from the host.
      - SMG_MULE_RPC_HOST=container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    restart: unless-stopped

  smuggler-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: smuggler-ui
    networks:
      - smuggler-net
    ports:
      # nginx listens on :80 in the container; loopback-only on the host.
      - "127.0.0.1:8887:80"
    environment:
      # Injected into the proxied X-Smuggler-Token header so the same-origin UI
      # authenticates to a token-gated API. Only SMG_* vars are substituted.
      - SMG_API_TOKEN=${SMG_API_TOKEN:-}
      - NGINX_ENVSUBST_FILTER=^SMG_
    depends_on:
      - smuggler-api
    restart: unless-stopped

networks:
  smuggler-net:
    name: smuggler-net
    driver: bridge

  # internal: no gateway, so containers on it get no default route and have no
  # egress at all. Mules join it as a *second* interface, which is what keeps
  # the kill-switch correct — it seals the interface carrying the default
  # route, and this network can never provide one.
  smuggler-rpc:
    name: smuggler-rpc
    driver: bridge
    internal: true
